[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinops"
version = "0.1.0"
description = "Shared contracts and services for Forzy TwinOps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]
research = [
    "rarfile>=4.5,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL and a disposable PostgreSQL database"]

[tool.setuptools.packages.find]
where = ["src"]
